name: skilltracker

volumes:
  redis-data:
  main-db-data:
  minio-data:

# port 1025: Mailpit SMTP
# port 8025: Mailpit Web UI
# port 9000: MinIO API
# port 9001: MinIO Console
# port 8081: Seq Web UI
# port 5432: PostgreSQL
# port 6379: Redis
# port 5000: SkillTracker Web API
# port 8082: Centrifugo API
# port 8083: Centrifugo Web UI

services:
  # Mailpit
  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
  # MinIO
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    command: minio server /data --console-address ":9001"
  # Seq
  seq:
    image: datalust/seq:2024.3
    container_name: seq
    environment:
      - ACCEPT_EULA=Y
    ports:
      - 8081:80
  # PostgreSQL
  main-db:
    container_name: main-db
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
    ports:
      - 5432:5432
    volumes:
      - main-db-data:/var/lib/postgresql/data
    healthcheck:
      test: psql -U postgres -q -d postgres -c "SELECT 'ready';"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
  # Redis
  redis:
    image: redis:latest
    container_name: redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_USER=${REDIS_USER}
      - REDIS_USER_PASSWORD=${REDIS_USER_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/var/lib/redis/data
      - ./config/redis/redis.conf:/etc/redis/redis.conf
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    command: redis-server /etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$REDIS_PASSWORD", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    tty: true
    stdin_open: true
  # SkillTracker Web API
  skilltracker-webapi:
    image: vga815/skilltracker-webapi:dev
    container_name: skilltracker-webapi
    depends_on:
      - main-db
      - redis
      - minio
      - mailpit
      - seq
    ports:
      - 5000:8080
    environment:
        ASPNETCORE_ENVIRONMENT: Development
        ConnectionStrings__Database: ${POSTGRES_CONNECTION_STRING}
        JWT__Secret: ${JWT_SECRET_KEY}
        JWT__Issuer: ${JWT_ISSUER}
        JWT__Audience: ${JWT_AUDIENCE}
        Minio__AccessKey: ${MINIO_ACCESS_KEY}
        Minio__SecretKey: ${MINIO_SECRET_KEY}
        Minio__PubEndpoint: ${MINIO_PUB_ENDPOINT}
        Redis__ConnectionString: ${REDIS_CONNECTION_STRING}
        Smtp__Username: ${SMTP_USERNAME}
        Centrifugo__ApiKey: ${CENTRIFUGO_API_KEY}
  # Centrifugo
  centrifugo:
    container_name: centrifugo
    image: centrifugo/centrifugo:v5
    volumes:
      - ./config/centrifugo/config.json:/centrifugo/config.json
    command: centrifugo -c config.json --api_insecure --swagger
    ports:
      - 8082:8000
      - 8083:8001
    ulimits:
      nofile:
        soft: 65535
        hard: 65535